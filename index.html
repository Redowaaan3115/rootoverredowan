<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus OS • Elite Edition</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --blur: 18px;
      --glass: rgba(255,255,255,0.12);
      --text: #fff;
      --accent: #6ee7ff;
    }

    * { box-sizing: border-box; margin:0; padding:0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb') center/cover fixed;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(var(--blur));
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      margin-bottom: 10px;
    }

    h2 { margin-bottom: 10px; }

    button, input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin: 5px 0;
      background: rgba(255,255,255,0.2);
      color: white;
      cursor: pointer;
    }

    button:hover { background: rgba(255,255,255,0.35); }

    .row { display:flex; flex-wrap:wrap; gap:15px; }
    .col { flex:1; min-width:250px; }

    #todoList li {
      list-style:none;
      margin:5px 0;
      padding:8px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      cursor:pointer;
    }

    /* FOCUS MODE */
    .focus-mode .glass:not(.focus-only) { display:none; }

    /* FLOATING PLAYER */
    .floating-player {
      position: fixed;
      bottom: 15px;
      right: 15px;
      padding: 10px 15px;
      border-radius: 15px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    /* ANALYTICS */
    .chart-bar {
      height: 20px;
      background: var(--accent);
      margin: 5px 0;
      border-radius: 8px;
      transition: 0.4s;
    }

    /* LOGIN */
    #loginBox {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(15px);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    #loginBox input { width: 100%; }
  </style>
</head>
<body>

<!-- LOGIN SYSTEM -->
<div id="loginBox">
  <div class="glass" style="width:300px;">
    <h2>Login</h2>
    <input id="loginUser" placeholder="Username">
    <button onclick="login()">Enter</button>
  </div>
</div>

<div class="container" id="mainApp" style="display:none;">
  <h1>⚡ Focus OS • Elite Edition</h1>

  <!-- BACKGROUND -->
  <div class="glass">
    <h2>🎨 Background</h2>
    <input type="file" id="bgUpload" accept="image/*">
    <input type="range" min="5" max="40" value="18" id="blurControl">
  </div>

  <!-- COUNTDOWN -->
  <div class="glass">
    <h2>🔥 SSC Countdown (April 21)</h2>
    <h1 id="countdown"></h1>
  </div>

  <!-- BD TIME -->
  <div class="glass">
    <h2>⏰ Bangladesh Time</h2>
    <h1 id="time"></h1>
  </div>

  <div class="row">
    <div class="glass col focus-only">
      <h2>⏳ Pomodoro</h2>
      <h1 id="pomodoro">25:00</h1>
      <button onclick="startPomodoro()">Start</button>
      <button onclick="resetPomodoro()">Reset</button>
    </div>

    <div class="glass col">
      <h2>📝 To-Do</h2>
      <input id="todoInput" placeholder="Task...">
      <button onclick="addTodo()">Add</button>
      <ul id="todoList"></ul>
    </div>
  </div>

  <!-- MUSIC PLAYER -->
  <div class="glass">
    <h2>🎧 Sounds</h2>
    <button onclick="play('lofi')">Lofi</button>
    <button onclick="play('rain')">Rain</button>
    <button onclick="play('fire')">Fire</button>
    <button onclick="stop()">Stop</button>
    <input type="file" id="musicUpload" multiple>
    <div id="musicList"></div>
  </div>

  <!-- ANALYTICS -->
  <div class="glass">
    <h2>📊 Study Analytics</h2>
    <div id="analytics"></div>
  </div>

  <div class="glass">
    <h2>⚙️ Settings</h2>
    <button onclick="toggleFocus()">Focus Mode</button>
    <button onclick="saveState()">Save</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="floating-player" id="nowPlaying">🎵 idle</div>
<audio id="audio"></audio>

<script>
// LOGIN
function login(){
  let user = loginUser.value.trim();
  if(!user) return;
  localStorage.setItem('user', user);
  loginBox.style.display='none';
  mainApp.style.display='block';
  loadState();
}

window.onload=()=>{
  if(localStorage.getItem('user')){
    loginBox.style.display='none';
    mainApp.style.display='block';
    loadState();
  }
}

function logout(){ localStorage.clear(); location.reload(); }

// TIME
setInterval(()=>{
  let d = new Date();
  let utc = d.getTime()+d.getTimezoneOffset()*60000;
  let bd = new Date(utc+6*3600000);
  time.textContent = bd.toLocaleTimeString();
},1000);

// COUNTDOWN
function updateCountdown(){
  let exam = new Date('2026-04-21');
  let now = new Date();
  let diff = exam - now;
  let d = Math.floor(diff/(1000*60*60*24));
  countdown.textContent = d + " days left";
}
setInterval(updateCountdown,1000);

// BACKGROUND
bgUpload.onchange = e=>{
  let f = e.target.files[0];
  let r = new FileReader();
  r.onload=()=> document.body.style.backgroundImage=`url(${r.result})`;
  r.readAsDataURL(f);
}

blurControl.oninput = e=> document.documentElement.style.setProperty('--blur', e.target.value+'px');

// TODO
function addTodo(){
  let val = todoInput.value;
  if(!val) return;
  let li = document.createElement('li');
  li.textContent = val;
  li.onclick=()=>li.remove();
  todoList.appendChild(li);
  todoInput.value='';
}

// POMODORO
let pTime=1500, pInt;
function startPomodoro(){
  clearInterval(pInt);
  pInt=setInterval(()=>{
    if(pTime<=0){
      alert('Break time!');
      saveStudyMinute();
      return;
    }
    pTime--;
    let m=Math.floor(pTime/60);
    let s=pTime%60;
    pomodoro.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}
function resetPomodoro(){ pTime=1500; pomodoro.textContent='25:00'; }

// SOUNDS
const sounds={
  lofi:'https://cdn.pixabay.com/audio/2022/03/15/audio_b3a4a4c5d3.mp3',
  rain:'https://cdn.pixabay.com/audio/2022/03/11/audio_70b176ce7e.mp3',
  fire:'https://cdn.pixabay.com/audio/2022/10/30/audio_fire.mp3'
};

function play(type){
  audio.src=sounds[type];
  audio.loop=true;
  audio.play();
  nowPlaying.textContent='🎵 '+type;
}
function stop(){ audio.pause(); nowPlaying.textContent='🎵 stopped'; }

// CUSTOM MUSIC
musicUpload.onchange=e=>{
  musicList.innerHTML='';
  [...e.target.files].forEach(f=>{
    let url=URL.createObjectURL(f);
    let btn=document.createElement('button');
    btn.textContent=f.name;
    btn.onclick=()=>{ audio.src=url; audio.play(); nowPlaying.textContent=f.name };
    musicList.appendChild(btn);
  })
}

// ANALYTICS
function saveStudyMinute(){
  let key='study_'+new Date().toDateString();
  let v = parseInt(localStorage.getItem(key) || '0');
  localStorage.setItem(key, v+25);
  renderAnalytics();
}

function renderAnalytics(){
  analytics.innerHTML='';
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith('study_')){
      let mins = localStorage.getItem(k);
      let div=document.createElement('div');
      div.innerHTML = `<b>${k.replace('study_','')}:</b> ${mins} min`;

      let bar=document.createElement('div');
      bar.className='chart-bar';
      bar.style.width= Math.min(mins,300)+'px';

      analytics.appendChild(div);
      analytics.appendChild(bar);
    }
  })
}

// FOCUS MODE
function toggleFocus(){ document.body.classList.toggle('focus-mode'); }

// SAVE
function saveState(){ localStorage.setItem('todos', todoList.innerHTML); }
function loadState(){ if(localStorage.getItem('todos')) todoList.innerHTML = localStorage.getItem('todos'); renderAnalytics(); }

</script>

</body>
</html>
