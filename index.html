<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPTOR OS // FLIGHT DECK</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Animations for that God-Tier feel */
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        :root { --cyan: #00f2ff; --bg: #020508; }

        body { background: var(--bg); color: var(--cyan); font-family: 'Rajdhani'; overflow: hidden; margin: 0; }
        
        /* The "Activation" Overlay */
        #boot-seq { 
            position: fixed; inset: 0; background: black; z-index: 9999;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }

        .hud-grid { 
            display: grid; grid-template-columns: 300px 1fr 300px; padding: 20px; gap: 20px; 
            height: 100vh; opacity: 0; transition: opacity 2s;
        }

        .panel { border: 1px solid var(--cyan); padding: 15px; background: rgba(0,20,30,0.6); animation: pulse 4s infinite; }
        
        /* YouTube Embed Wrapper */
        .music-player { height: 100px; grid-column: 1 / 4; display: flex; align-items: center; gap: 20px; }
    </style>
</head>
<body>

    <div id="boot-seq" onclick="activateDeck()">
        <h1 style="font-family: 'Orbitron'; letter-spacing: 10px;">SYSTEM_OFFLINE // CLICK TO ENGAGE</h1>
    </div>

    <div class="hud-grid" id="main-deck">
        <div class="panel" style="grid-column: 2; height: 300px;">
            <h2 style="font-family: 'Orbitron'; font-size: 0.8rem;">RAPTOR_AI_INTEL</h2>
            <div id="chat" style="height: 200px; overflow-y: scroll;"></div>
        </div>

        <div class="panel music-player">
            <iframe id="yt-player" width="300" height="80" 
                src="https://www.youtube.com/embed/jfKfPfyJRdk?enablejsapi=1&autoplay=0" 
                frameborder="0" allow="autoplay"></iframe>
            <div>
                <h3>MISSION SOUNDTRACK</h3>
                <p>LOFI_STUDY_BEATS // STREAMING</p>
            </div>
        </div>
    </div>

    <script>
        function activateDeck() {
            // Remove boot screen
            document.getElementById('boot-seq').style.display = 'none';
            document.getElementById('main-deck').style.opacity = '1';
            
            // Trigger Music
            const player = document.getElementById('yt-player');
            player.src += "&autoplay=1";
            
            // Add initial animation
            document.getElementById('chat').innerHTML = "<p>> SYSTEM: Raptor OS Active. Audio Link Established.</p>";
        }
    </script>
</body>
</html>
