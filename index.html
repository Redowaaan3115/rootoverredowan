<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPTOR OS // COMBAT READY</title>
    <style>
        :root {
            --cyan: #00f2ff;
            --alert-red: #ff3c3c;
            --bg: #020508;
            --glass: rgba(6, 15, 25, 0.85);
        }

        body {
            background: var(--bg);
            color: var(--cyan);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* --- RADAR ANIMATION --- */
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-box { position: relative; width: 100px; height: 100px; border: 1px solid var(--cyan); border-radius: 50%; overflow: hidden; }
        .radar-line { 
            position: absolute; top: 50%; left: 50%; width: 50%; height: 2px; background: var(--cyan); 
            transform-origin: left; animation: radar-sweep 4s linear infinite; 
        }

        /* --- COMBAT MODE ANIMATION --- */
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px var(--cyan); }
            50% { box-shadow: 0 0 25px var(--alert-red); border-color: var(--alert-red); }
        }
        .combat-mode { animation: pulse 2s infinite; }

        /* --- LAYOUT --- */
        .grid { display: grid; grid-template-columns: 250px 1fr 300px; gap: 15px; padding: 20px; width: 100%; }
        .panel { background: var(--glass); border: 1px solid rgba(0, 242, 255, 0.2); padding: 20px; }

        /* --- MUSIC PLAYER --- */
        .radio-panel { grid-column: 1 / 4; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; }
        iframe { border: none; height: 50px; width: 300px; }

        .btn { padding: 10px 20px; border: 1px solid var(--cyan); background: transparent; color: var(--cyan); cursor: pointer; transition: 0.3s; }
        .btn:hover { background: var(--cyan); color: black; }
    </style>
</head>
<body>

<div class="grid">
    <div class="panel">
        <h3>RADAR SCAN</h3>
        <div class="radar-box"><div class="radar-line"></div></div>
    </div>

    <div class="panel" id="main-panel">
        <h1 id="timer">25:00</h1>
        <button class="btn" onclick="startCombat()">ENGAGE COMBAT</button>
    </div>

    <div class="panel">
        <h3>SYSTEM_INTEL</h3>
        <p>CPU LOAD: 12%</p>
        <p>FOCUS LEVEL: OPTIMAL</p>
    </div>

    <div class="panel radio-panel">
        <div>LOFI_RADIO_FEED</div>
        <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1" allow="autoplay"></iframe>
        <div>VOL: 65%</div>
    </div>
</div>

<script>
    function startCombat() {
        const panel = document.getElementById('main-panel');
        panel.classList.add('combat-mode');
        // Logic to start timer goes here
    }
</script>

</body>
</html>
