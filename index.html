<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus OS — F22 Hangar Edition</title>

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/theme-blue-neon.css">
</head>

<body>

    <div id="background"></div>

    <header class="top-bar">
        <div class="logo">F-22 HANGAR OPS</div>
        <div class="mode-switch">
            <button id="themeToggle">NEON MODE</button>
        </div>
    </header>

    <main class="dashboard">

        <section class="clock-panel glass">
            <div id="clock" class="time-display">00:00:00</div>
            <div id="date" class="date-display"></div>
        </section>

        <section class="pomodoro-panel glass">
            <h2>POMODORO ENGINE</h2>
            <div id="pomodoro-timer">25:00</div>
            <div class="pomodoro-controls">
                <button id="startPomodoro">Start</button>
                <button id="pausePomodoro">Pause</button>
                <button id="resetPomodoro">Reset</button>
            </div>
        </section>

        <section class="tasks-panel glass">
            <h2>MISSIONS</h2>
            <div class="task-input">
                <input type="text" id="taskInput" placeholder="Enter mission objective...">
                <button id="addTask">+</button>
            </div>
            <ul id="taskList"></ul>
        </section>

        <section class="music-panel glass">
            <h2>COCKPIT AUDIO</h2>
            <audio id="audioPlayer" controls></audio>
            <input type="file" id="uploadMusic" accept="audio/*">
        </section>

        <section class="ai-panel glass">
            <h2>AI COPILOT</h2>
            <textarea id="aiInput" placeholder="Ask your AI Copilot..."></textarea>
            <button id="aiSend">SEND</button>
            <div id="aiOutput"></div>
        </section>

    </main>

    <script type="module" src="scripts/firebase.js"></script>
    <script src="scripts/clock.js"></script>
    <script src="scripts/pomodoro.js"></script>
    <script src="scripts/tasks.js"></script>
    <script src="scripts/music.js"></script>
    <script src="scripts/ai.js"></script>
    <script src="scripts/main.js"></script>

</body>
</html>
